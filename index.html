<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CELESTIAL PATHS - プライベート・セキュアプロトタイプ</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400&family=Noto+Sans+JP:wght@300;400&display=swap');
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
        .cinzel {
            font-family: 'Cinzel', serif;
        }
    </style>
</head>
<body class="bg-[#070B19] text-[#E2E8F0] min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-md w-full bg-[#0D1326] border border-[#1E293B] rounded-2xl p-6 shadow-2xl relative overflow-hidden">
        
        <!-- 背景の天体軌道エフェクト装飾 -->
        <div class="absolute -top-24 -right-24 w-48 h-48 rounded-full border border-amber-500/10 pointer-events-none"></div>
        <div class="absolute -top-12 -right-12 w-24 h-24 rounded-full border border-amber-500/20 pointer-events-none"></div>

        <div class="text-center mb-6">
            <h1 class="cinzel text-xl font-light tracking-widest text-amber-200">CELESTIAL PATHS</h1>
            <p class="text-xs text-slate-400 mt-1">ゼロ知識・プライベート共有プロトタイプ</p>
        </div>

        <!-- ビュー切り替えタブ -->
        <div class="flex border-b border-slate-800 mb-6">
            <button onclick="switchTab('female')" id="tab-female" class="flex-1 pb-2 text-sm transition-colors border-b-2 border-amber-400 text-amber-200">
                【女性側端末】入力・暗号化
            </button>
            <button onclick="switchTab('male')" id="tab-male" class="flex-1 pb-2 text-sm transition-colors text-slate-500">
                【男性側端末】天体ビュー
            </button>
        </div>

        <!-- 断絶時表示 -->
        <div id="view-killed" class="hidden text-center py-10 text-rose-300">
            <p>パートナーシップは断絶されました。</p>
            <p class="text-xs text-slate-500 mt-2">すべてのセキュアキャッシュは破棄されています。</p>
        </div>

        <!-- 女性側画面 -->
        <div id="view-female" class="space-y-4">
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-800">
                <label class="block text-xs text-slate-400 mb-2">いまのコンディションの気配（ローカル入力）</label>
                <select id="raw-state" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-amber-400">
                    <option value="穏やかな波のめぐり（静穏期）">穏やかな波のめぐり（静穏期）</option>
                    <option value="深い夜の月（休息を必要とする時期）">深い夜の月（休息を必要とする時期）</option>
                    <option value="新月の前兆（静かに佇む時間）">新月の前兆（静かに佇む時間）</option>
                </select>
            </div>

            <button onclick="encryptAndTransmit()" class="w-full py-3 bg-gradient-to-r from-amber-600/80 to-amber-700/85 hover:from-amber-600 hover:to-amber-700 text-amber-100 rounded-xl text-sm font-medium tracking-wide shadow-lg transition-all">
                暗号化して気配を同期する (E2EE)
            </button>

            <!-- サーバー上のデータ（監査用） -->
            <div class="mt-6 p-3 bg-slate-950/80 rounded-lg border border-slate-900 text-xs">
                <span class="text-slate-500 block mb-1">【サーバー上のデータ（運営にはこう見えています）】</span>
                <code id="relay-display" class="text-amber-500/60 break-all">（データなし）</code>
                <p class="text-[10px] text-slate-600 mt-1">※サーバーは乱数（暗号文）を中継するだけで中身を読む権限を持ちません。</p>
            </div>

            <button onclick="killSwitch()" class="w-full mt-4 py-2 bg-transparent border border-rose-900/50 text-rose-400 hover:bg-rose-950/30 rounded-xl text-xs transition-all">
                接続を断絶する（Kill Switch）
            </button>
        </div>

        <!-- 男性側画面 -->
        <div id="view-male" class="space-y-6 text-center py-2 hidden">
            <!-- 天体グラフィックの暗示表現 -->
            <div class="relative w-32 h-32 mx-auto flex items-center justify-center">
                <div class="absolute inset-0 rounded-full border border-amber-500/20 animate-spin" style="animation-duration: 20s;"></div>
                <div class="absolute inset-3 rounded-full border border-dashed border-amber-400/30 animate-spin" style="animation-duration: 15s; animation-direction: reverse;"></div>
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-amber-200 to-amber-600 shadow-[0_0_20px_rgba(245,158,11,0.3)] flex items-center justify-center">
                    <span class="w-3 h-3 rounded-full bg-slate-950/80"></span>
                </div>
            </div>

            <div class="bg-slate-900/40 p-4 rounded-xl border border-slate-800/80">
                <span class="text-[10px] uppercase tracking-widest text-slate-500 block mb-1">Celestial State</span>
                <p id="decrypted-display" class="text-sm font-light text-amber-100">まだ気配はありません</p>
            </div>

            <button onclick="receiveAndDecrypt()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-amber-200 rounded-xl text-sm font-medium tracking-wide border border-slate-700 transition-all">
                気配を受け取る（端末内ローカル復号）
            </button>

            <p class="text-[11px] text-slate-500 leading-relaxed px-2">
                ※数字やスケジュールは一切表示されません。天体の軌道と微かな光のめぐりから、ただ静かに寄り添います。
            </p>
        </div>

    </div>

    <!-- 暗号化・ロジック制御スクリプト -->
    <script>
        let cryptoKey = null;
        let encryptedPayload = null;
        let isConnected = true;

        // 共通鍵の生成 (Web Crypto API)
        async function initCrypto() {
            cryptoKey = await window.crypto.subtle.generateKey(
                { name: "AES-GCM", length: 256 },
                true,
                ["encrypt", "decrypt"]
            );
        }
        initCrypto();

        // タブ切り替え
        function switchTab(target) {
            if (!isConnected) return;
            const tabFemale = document.getElementById('tab-female');
            const tabMale = document.getElementById('tab-male');
            const viewFemale = document.getElementById('view-female');
            const viewMale = document.getElementById('view-male');

            if (target === 'female') {
                tabFemale.className = "flex-1 pb-2 text-sm transition-colors border-b-2 border-amber-400 text-amber-200";
                tabMale.className = "flex-1 pb-2 text-sm transition-colors text-slate-500";
                viewFemale.classList.remove('hidden');
                viewMale.classList.add('hidden');
            } else {
                tabMale.className = "flex-1 pb-2 text-sm transition-colors border-b-2 border-amber-400 text-amber-200";
                tabFemale.className = "flex-1 pb-2 text-sm transition-colors text-slate-500";
                viewMale.classList.remove('hidden');
                viewFemale.classList.add('hidden');
            }
        }

        // 女性側：暗号化送信
        async function encryptAndTransmit() {
            if (!cryptoKey) return;
            const rawText = document.getElementById('raw-state').value;
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encoded = new TextEncoder().encode(rawText);

            const ciphertext = await window.crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv },
                cryptoKey,
                encoded
            );

            encryptedPayload = {
                iv: Array.from(iv),
                ciphertext: Array.from(new Uint8Array(ciphertext))
            };

            // サーバー側の表示（難読化されたデータ）
            document.getElementById('relay-display').innerText = JSON.stringify(encryptedPayload).slice(0, 90) + '...';
            alert('気配を暗号化して中継サーバーに同期しました（サーバー側では中身は読めません）');
        }

        // 男性側：復号受信
        async function receiveAndDecrypt() {
            if (!cryptoKey || !encryptedPayload) {
                document.getElementById('decrypted-display').innerText = "（届いている気配はありません）";
                return;
            }

            try {
                const iv = new Uint8Array(encryptedPayload.iv);
                const ciphertext = new Uint8Array(encryptedPayload.ciphertext);

                const decrypted = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    cryptoKey,
                    ciphertext
                );

                const plainText = new TextDecoder().decode(decrypted);
                document.getElementById('decrypted-display').innerText = plainText;
            } catch (e) {
                document.getElementById('decrypted-display').innerText = "[復号失敗：鍵が一致しません]";
            }
        }

        // キルスイッチ（接続断絶）
        function killSwitch() {
            isConnected = false;
            encryptedPayload = null;
            document.getElementById('view-female').classList.add('hidden');
            document.getElementById('view-male').classList.add('hidden');
            document.getElementById('view-killed').classList.remove('hidden');
        }
    </script>
</body>
</html>
